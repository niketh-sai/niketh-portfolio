<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      try {
        if (window.innerWidth <= 768 && window.sessionStorage) {
          var dir = sessionStorage.getItem('swipeNavDirection');
          if (dir) {
            sessionStorage.removeItem('swipeNavDirection');
            var cls = dir === 'left' ? 'swipe-enter-from-right' : 'swipe-enter-from-left';
            document.documentElement.classList.add(cls);
          }
        }
      } catch (e) {}
    })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
  <meta name="description" content="The Builds — Projects by Niketh Sai. Engineered systems, prototypes and experiments in AI, ML and Generative AI.">
  <link rel="canonical" href="https://niketh-portfolio-jsah.vercel.app/projects.html">
  <meta property="og:title" content="The Builds — Niketh Sai">
  <meta property="og:description" content="Engineered systems, prototypes and experiments in AI, ML and Generative AI.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://niketh-portfolio-jsah.vercel.app/projects.html">
  <meta name="twitter:card" content="summary">
  <title>The Builds — Niketh Sai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      let isReload = false;
      if (window.performance) {
        const navEntries = window.performance.getEntriesByType('navigation');
        if (navEntries.length > 0 && navEntries[0].type === 'reload') {
          isReload = true;
        } else if (window.performance.navigation && window.performance.navigation.type === 1) {
          isReload = true;
        }
      }
      if (isReload) {
        window.location.replace('index.html');
      }
    })();
  </script>
</head>
<body class="projects-page">

<header class="navbar">
  <div class="logo">NIKETH</div>
  <nav class="nav-links">
    <a href="index.html">INTRO</a>
    <a href="projects.html" class="active">THE BUILDS</a>
    <a href="experience.html">JOURNEY</a>
    <a href="education.html">THE LAB</a>
  </nav>
</header>

<main>
  <section id="projects" class="content-section">
    <div class="section-inner">
      <h2 class="section-title">THE BUILDS</h2>
      <p class="section-subtitle">ENGINEERED SYSTEMS &middot; PROTOTYPES &middot; EXPERIMENTS</p>
      <p class="repo-notice">Note: Some project repositories may be private or unavailable for public access.</p>

      <!-- Filter Controls (Horizontally scrollable on mobile) -->
      <div class="filter-container" role="tablist" aria-label="Filter projects by classification">
        <button class="filter-btn active" data-filter="all" role="tab" aria-selected="true">ALL</button>
        <button class="filter-btn" data-filter="ai-ml" role="tab" aria-selected="false">AI / ML</button>
        <button class="filter-btn" data-filter="genai" role="tab" aria-selected="false">GENAI</button>
        <button class="filter-btn" data-filter="mini-builds" role="tab" aria-selected="false">MINI BUILDS</button>
        <button class="filter-btn" data-filter="experiments" role="tab" aria-selected="false">EXPERIMENTS</button>
      </div>

      <!-- Projects Grid (Dynamic) -->
      <div class="projects-grid" id="projectsGrid">
        <!-- Projects will be rendered here by JavaScript -->
      </div>

      <div style="margin-top: 45px; display: flex; justify-content: flex-start;">
        <a href="index.html" class="pill-btn" style="text-decoration: none; font-size: 0.75rem; padding: 13px 30px;">
          <span class="btn-arrow btn-arrow-left" style="margin-right: 4px; margin-left: 0;">&larr;</span>
          <span>BACK TO INTRO</span>
        </a>
      </div>
    </div>
  </section>
</main>

<script>
  // Project Data
  const projectsData = [
    {
      name: "Hybrid Search Engine",
      description: "Combined keyword and semantic search system for improved document retrieval accuracy.",
      tags: ["Python", "FastAPI", "Streamlit", "Scikit-learn"],
      classification: "PROJECT",
      filters: ["ai-ml"],
      github: "https://github.com/niketh-sai/Hybrid-Search-Engine"
    },
    {
      name: "ExAI",
      description: "Explainable AI framework providing interpretability and transparency for ML model decisions.",
      tags: ["Python", "Streamlit", "Scikit-learn", "Ollama"],
      classification: "PROJECT",
      filters: ["ai-ml"],
      github: "https://github.com/niketh-sai/ExAI"
    },
    {
      name: "NeuralNews",
      description: "Automated news aggregation and classification system using neural networks.",
      tags: ["Python", "Streamlit", "Transformers", "SQLite"],
      classification: "PROJECT",
      filters: ["ai-ml"],
      github: "https://github.com/niketh-sai/NeuralNews"
    },
    {
      name: "Cyberbullying Detection System",
      description: "ML-powered system detecting cyberbullying patterns in social media text data.",
      tags: ["Python", "Streamlit", "NLP", "Scikit-learn"],
      classification: "PROJECT",
      filters: ["ai-ml"],
      github: "https://github.com/niketh-sai/Cyberbullying-Detection-System"
    },
    {
      name: "Decision Tree",
      description: "Implementation of decision tree algorithm from scratch with visualization capabilities.",
      tags: ["Python", "Machine Learning", "Data Structures", "Visualization"],
      classification: "PROJECT",
      filters: ["ai-ml"],
      github: "https://github.com/niketh-sai/Decision-Tree"
    },
    {
      name: "DocRAG",
      description: "Fully offline RAG system for querying local documents without third-party APIs.",
      tags: ["Python", "FastAPI", "Ollama", "RAG", "HTML/CSS/JS"],
      classification: "PROJECT",
      filters: ["genai"],
      github: "https://github.com/niketh-sai/DocRAG"
    },
    {
      name: "Tic-Tac-Toe",
      description: "Classic game implementation with minimax algorithm and AI opponent.",
      tags: ["Python", "Streamlit"],
      classification: "MINI BUILD",
      filters: ["mini-builds"],
      github: "https://github.com/niketh-sai/TIC-TAC-TOE"
    },
    {
      name: "Rock Paper Scissors",
      description: "Interactive game with pattern recognition and adaptive AI strategies.",
      tags: ["Python", "Streamlit", "Plotly"],
      classification: "MINI BUILD",
      filters: ["mini-builds"],
      github: "https://github.com/niketh-sai/ROCK-PAPER-SCISSORS"
    },
    {
      name: "QLoRA Testing",
      description: "Experiments with QLoRA quantization for efficient LLM fine-tuning on consumer hardware.",
      tags: ["Under Development"],
      classification: "EXPERIMENT",
      filters: ["experiments"],
      github: "https://github.com/niketh-sai/QLoRA-Testing"
    }
  ];

  // Render Projects
  function renderProjects(filter = 'all') {
    const grid = document.getElementById('projectsGrid');
    if (!grid) return;

    grid.innerHTML = '';

    const filteredProjects = filter === 'all'
      ? projectsData
      : projectsData.filter(project => project.filters && project.filters.includes(filter));

    filteredProjects.forEach((project, index) => {
      const card = document.createElement('article');
      card.className = 'proj-card';
      card.style.opacity = '1';
      card.style.transform = 'translateY(0)';

      const header = document.createElement('div');
      header.className = 'proj-header';

      const classification = document.createElement('span');
      classification.className = 'proj-classification';
      classification.textContent = project.classification;

      const titleRow = document.createElement('div');
      titleRow.className = 'proj-title-row';

      const title = document.createElement('h3');
      title.className = 'proj-title';
      title.textContent = project.name;

      titleRow.appendChild(title);

      if (project.github) {
        const githubLink = document.createElement('a');
        githubLink.href = project.github;
        githubLink.target = '_blank';
        githubLink.rel = 'noopener noreferrer';
        githubLink.className = 'proj-github-icon';
        githubLink.setAttribute('aria-label', 'View ' + project.name + ' source code on GitHub');
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('width', '16');
        svg.setAttribute('height', '16');
        svg.setAttribute('viewBox', '0 0 24 24');
        svg.setAttribute('fill', 'currentColor');
        svg.setAttribute('aria-hidden', 'true');
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', 'M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z');
        svg.appendChild(path);
        githubLink.appendChild(svg);
        titleRow.appendChild(githubLink);
      }

      header.appendChild(classification);
      header.appendChild(titleRow);

      const desc = document.createElement('p');
      desc.className = 'proj-desc';
      desc.textContent = project.description;

      const stack = document.createElement('div');
      stack.className = 'proj-stack';
      project.tags.forEach(tag => {
        const span = document.createElement('span');
        span.textContent = tag;
        stack.appendChild(span);
      });

      card.appendChild(header);
      card.appendChild(desc);
      card.appendChild(stack);

      grid.appendChild(card);
    });
  }

  // Filter Event Listeners
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-selected', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-selected', 'true');
      const filter = btn.dataset.filter || 'all';
      renderProjects(filter);
    });
  });

  // Initial render
  renderProjects();
</script>

<script src="script.js"></script>
</body>
</html>
